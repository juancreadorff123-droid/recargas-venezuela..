<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Recargas Venezuela | Free Fire</title>

<style>

body{
margin:0;
font-family:Arial;
background:#050816;
color:white;
}

header{
background:linear-gradient(90deg,#ff0000,#ff7300);
padding:25px;
text-align:center;
}

header h1{
font-size:35px;
margin:0;
}
.logo{
font-size:28px;
font-weight:bold;
color:#ffd700;
margin-bottom:15px;
text-shadow:0 0 10px #ff0000;
  }
.banner{
padding:50px 20px;
text-align:center;

}

.banner h2{
font-size:30px;
}

.btn{

color:white;
padding:15px 30px;

.productos{
display:flex;

justify-content:center;

.card{

.card h3{

.precio{

<body>

<div class="card">

<a class="btn" href="#">Comprar</a>
</div>

</html>
