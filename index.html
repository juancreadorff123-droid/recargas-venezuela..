<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recargas Express FF</title>
    <!-- Librería estable de iconos FontAwesome -->
    <link rel="stylesheet" href="https://cloudflare.com">
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Arial, sans-serif;
            background: url('fondo.jpg') no-repeat center center fixed;
            background-size: cover;
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
            padding: 0px 12px 100px 12px;
            overflow-x: hidden;
        }

        /* ENCABEZADO ESTILO NEXUS (FONDO NEGRO CON TEXTO DEGRADADO NARANJA) */
        .header-nexus {
            width: 100%;
            background: #000000;
            padding: 15px 10px;
            text-align: center;
            box-sizing: border-box;
            border-bottom: 2px solid #f97316; /* Borde inferior naranja */
            margin-bottom: 25px;
        }

        .header-nexus h1 {
            font-size: 26px;
            font-weight: 900;
            margin: 0 0 5px 0;
            text-transform: uppercase;
            letter-spacing: 1px;
            /* Degradado naranja fuego */
            background: linear-gradient(180deg, #ffedd5 0%, #f97316 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 2px 8px rgba(249, 115, 22, 0.4);
        }

        /* Texto legal pequeño debajo del título */
        .legal-text {
            font-size: 11px;
            color: #fbbf24; /* Color amarillo/naranja de advertencia */
            font-weight: 600;
            margin: 0;
            max-width: 450px;
            margin: 0 auto;
            line-height: 1.3;
        }

        /* CONTENEDOR PRINCIPAL CON BORDE NARANJA SOLICITADO */
        .card-panel {
            background: rgba(10, 15, 30, 0.85);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border: 2px solid #f97316; /* ¡Borde naranja configurado! */
            border-radius: 20px;
            width: 100%;
            max-width: 380px;
            padding: 22px;
            box-sizing: border-box;
            margin-bottom: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6), 0 0 15px rgba(249, 115, 22, 0.2);
        }

        /* TEXTO ID JUGADOR EN COLOR NARANJA */
        .section-title {
            text-align: center;
            font-size: 14px;
            font-weight: 800;
            color: #f97316; /* ¡Texto e iconos en naranja! */
            letter-spacing: 2px;
            margin-top: 0;
            margin-bottom: 20px;
        }

        .search-container {
            display: flex;
            gap: 12px;
            margin-bottom: 12px;
        }

        .input-id {
            flex: 1;
            background: rgba(2, 6, 17, 0.8);
            border: 2px solid #c2410c;
            border-radius: 12px;
            padding: 14px;
            color: white;
            font-size: 16px;
            outline: none;
        }

        .input-id:focus {
            border-color: #f97316;
        }

        .input-id::placeholder {
            color: #475569;
        }

        /* Botón de buscar adaptado al color naranja */
        .btn-search {
            background: #f97316;
            border: none;
            border-radius: 12px;
            width: 55px;
            color: white;
            font-size: 18px;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 4px 12px rgba(249, 115, 22, 0.3);
        }

        /* Subtexto de ejemplo debajo del campo ID */
        .example-text {
            font-size: 12px;
            color: #94a3b8;
            text-align: center;
            margin: 0 0 15px 0;
        }

        .btn-history {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            width: 100%;
            background: transparent;
            border: 2px solid #c2410c;
            border-radius: 12px;
            color: #f97316;
            padding: 12px;
            font-size: 16px;
            cursor: pointer;
            font-weight: 600;
        }

        /* PANEL DE VERIFICACIÓN (LOADER CON DIAMANTE) */
        #loader-panel {
            display: none;
            text-align: center;
        }

        .diamond-circle {
            width: 80px;
            height: 80px;
            border: 3px dashed #f97316;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0 auto 15px auto;
            animation: rotar 5s linear infinite;
        }

        .diamond-circle i {
            font-size: 32px;
            color: #f97316;
            animation: destello 1.2s ease-in-out infinite alternate;
        }

        .loader-text {
            font-size: 13px;
            font-weight: bold;
            color: #94a3b8;
            letter-spacing: 2px;
            margin-bottom: 20px;
            text-transform: uppercase;
        }

        .progress-bar-container {
            width: 85%;
            height: 6px;
            background: rgba(2, 6, 17, 0.8);
            border-radius: 10px;
            margin: 0 auto;
            overflow: hidden;
            position: relative;
        }

        .progress-bar-fill {
            width: 45%;
            height: 100%;
            background: linear-gradient(90deg, #f97316, #facc15);
            border-radius: 10px;
            position: absolute;
            animation: moverBarra 1.4s infinite linear;
        }

        /* OTROS JUEGOS CON BORDE AZUL CLÁSICO */
        .card-panel-games {
            background: rgba(10, 15, 30, 0.85);
            backdrop-filter: blur(8px);
            border: 2px solid #06b6d4;
            border-radius: 20px;
            width: 100%;
            max-width: 380px;
            padding: 22px;
            box-sizing: border-box;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6), 0 0 15px rgba(6, 182, 212, 0.2);
        }

        .games-title {
            font-size: 20px;
            font-weight: 800;
            margin-top: 0;
            margin-bottom: 20px;
            text-transform: uppercase;
            letter-spacing: 1px;
            text-align: center;
        }

        .game-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(2, 6, 17, 0.5);
            padding: 14px;
            border-radius: 14px;
        }

        .game-info {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .game-icon-fallback {
            width: 45px;
            height: 45px;
            border-radius: 10px;
            background: linear-gradient(135deg, #06b6d4, #0891b2);
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 20px;
            color: white;
        }

        .game-name {
            font-size: 16px;
            font-weight: 600;
        }

        .status-badge {
            background: rgba(34, 197, 94, 0.15);
            color: #22c55e;
            border: 1px solid rgba(34, 197, 94, 0.4);
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 11px;
            font-weight: 800;
        }

        /* SOPORTE DE WHATSAPP FLOTANTE */
        .whatsapp-footer {
            position: fixed;
            bottom: 25px;
            background: #1e293b;
            padding: 12px 24px;
            border-radius: 50px;
            display: flex;
            align-items: center;
            gap: 12px;
            text-decoration: none;
            color: white;
            font-weight: 700;
            font-size: 15px;
            border: 1px solid #f97316;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            z-index: 100;
        }

        .whatsapp-footer i {
            color: #22c55e;
            font-size: 22px;
        }

        /* ANIMACIONES CSS */
        @keyframes rotar { 100% { transform: rotate(360deg); } }
        @keyframes destello {
            from { opacity: 0.4; filter: drop-shadow(0 0 2px #f97316); }
            to { opacity: 1; filter: drop-shadow(0 0 14px #fbbf24); }
        }
        @keyframes moverBarra {
            0% { left: -45%; }
            100% { left: 100%; }
        }
    </style>
</head>
<body>

    <!-- ENCABEZADO SUPERIOR CON ADVERTENCIA LEGAL -->
    <div class="header-nexus">
        <h1>Recargas Express FF</h1>
        <p class="legal-text">Revendedor independiente • No afiliado a Garena, Moonton, Tencent ni miHoYo • Marcas © de sus dueños</p>
    </div>

    <!-- PANEL ID CON DISEÑO NARANJA -->
    <div class="card-panel">
        <p class="section-title"><i class="fa-solid fa-id-card"></i> ID DEL JUGADOR</p>
        
        <div class="search-container">
            <input type="text" id="userId" class="input-id" placeholder="Ingresa tu ID">
            <button class="btn-search" onclick="verificarID()">
                <i class="fa-solid fa-magnifying-glass"></i>
            </button>
        </div>
        
        <p class="example-text">Ejemplo: 6068831320</p>

        <button class="btn-history">
            <i class="fa-solid fa-circle-user"></i> Historial
        </button>
    </div>

    <!-- PANEL DE CARGA VERIFICANDO ID -->
    <div class="card-panel" id="loader-panel">
        <div class="diamond-circle">
            <i class="fa-solid fa-gem"></i>
        </div>
