<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recargas Express FF</title>
    <!-- Iconos de FontAwesome estables -->
    <link rel="stylesheet" href="https://cloudflare.com">
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Arial, sans-serif;
            background: url('fondo.jpg') no-repeat center center fixed;
            background-size: cover;
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
            padding-bottom: 120px;
        }

        /* HEADER SUPERIOR IDÉNTICO */
        .header-nexus {
            width: 100%;
            background: #0d0f14;
            padding: 18px 12px;
            text-align: center;
            box-sizing: border-box;
            border-bottom: 2px solid #ea580c;
        }

        .header-nexus h1 {
            font-size: 24px;
            font-weight: bold;
            margin: 0 0 6px 0;
            color: #f97316;
            letter-spacing: 0.5px;
        }

        .legal-text {
            font-size: 10.5px;
            color: #e2e8f0;
            margin: 0;
            line-height: 1.4;
            opacity: 0.8;
        }

        /* CONTENEDOR PRINCIPAL TRANSLÚCIDO OSCURO */
        .card-panel {
            background: rgba(15, 23, 42, 0.75);
            border: 2px solid rgba(249, 115, 22, 0.4);
            border-radius: 24px;
            width: 92%;
            max-width: 380px;
            padding: 24px 20px;
            box-sizing: border-box;
            margin-top: 30px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.7);
        }

        /* TÍTULO SECCIÓN CON ICONO GAMER */
        .section-title {
            font-size: 14px;
            font-weight: bold;
            color: #f97316;
            letter-spacing: 1px;
            margin-top: 0;
            margin-bottom: 22px;
            text-transform: uppercase;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .search-container {
            display: flex;
            gap: 12px;
            margin-bottom: 20px;
        }

        /* CAMPO ENTRADA DE ID */
        .input-id {
            flex: 1;
            background: rgba(30, 41, 59, 0.7);
            border: 1.5px solid rgba(249, 115, 22, 0.3);
            border-radius: 14px;
            padding: 16px;
            color: #f1f5f9;
            font-size: 18px;
            outline: none;
        }

        .input-id::placeholder {
            color: #94a3b8;
        }

        /* BOTÓN AZUL CIAN CON EL DIAMANTE REPLICADO */
        .btn-search {
            background: linear-gradient(135deg, #0ea5e9, #0284c7);
            border: none;
            border-radius: 14px;
            width: 62px;
            height: 58px;
            color: white;
            font-size: 22px;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 4px 14px rgba(2, 132, 199, 0.4);
        }

        .example-text {
            font-size: 12px;
            color: #64748b;
            text-align: center;
            margin: -10px 0 20px 0;
        }

        /* NUEVA ZONA: ÚLTIMO ID GUARDADO */
        .last-id-container {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(15, 23, 42, 0.5);
            border: 1px solid rgba(249, 115, 22, 0.2);
            border-radius: 14px;
            padding: 10px 14px;
            margin-bottom: 20px;
        }

        .last-id-label {
            font-size: 12px;
            color: #94a3b8;
            max-width: 60px;
            line-height: 1.2;
        }

        .last-id-number {
            font-size: 19px;
            font-weight: bold;
            color: #ea580c;
            letter-spacing: 0.5px;
        }

        .btn-return {
            background: #ea580c;
            border: none;
            color: white;
            width: 36px;
            height: 34px;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* BOTÓN HISTORIAL ESTILIZADO CON BORDE AZUL */
        .btn-history {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            width: 100%;
            background: rgba(15, 23, 42, 0.8);
            border: 1.5px solid #0284c7;
            border-radius: 14px;
            color: #f97316;
            padding: 14px;
            font-size: 16px;
            cursor: pointer;
            font-weight: bold;
        }

        .btn-history i {
            color: #38bdf8;
        }

        /* TEXTO FLOTANTE DE OTROS JUEGOS */
        .games-section-title {
            text-align: center;
            font-size: 15px;
            font-weight: 800;
            color: #94a3b8;
            letter-spacing: 3px;
            margin-top: 35px;
            margin-bottom: 20px;
            text-transform: uppercase;
        }

        /* FILA DEL JUEGO BLOOD STRIKE */
        .game-card {
            background: rgba(15, 23, 42, 0.75);
            border-radius: 20px;
            width: 92%;
            max-width: 380px;
            padding: 14px 18px;
            box-sizing: border-box;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
        }

        .game-details {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .game-img {
            width: 48px;
            height: 48px;
            border-radius: 12px;
            object-fit: cover;
            border: 1px solid rgba(255,255,255,0.1);
        }

        .game-title-text {
            font-size: 18px;
            font-weight: bold;
            color: white;
        }

        .badge-available {
            background: #047857;
            color: #10b981;
            padding: 5px 12px;
            border-radius: 8px;
            font-size: 11px;
            font-weight: 800;
            letter-spacing: 0.5px;
        }

        /* BOTONES FLOTANTES DE ACCIÓN INFERIOR */
        .action-buttons-container {
            position: fixed;
            bottom: 20px;
            right: 20px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            z-index: 100;
        }

        .action-btn {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 10px 18px;
            border-radius: 20px;
            color: white;
            font-weight: bold;
            font-size: 14px;
            text-decoration: none;
            box-shadow: 0 8px 20px rgba(0,0,0,0.4);
        }

        .btn-tutorial {
            background: #ea580c;
        }

        .btn-support {
            background: #10b981;
        }
    </style>
</head>
<body>

    <!-- ENCABEZADO CON ADVERTENCIAS LEGALES -->
    <div class="header-nexus">
        <h1>Recargas Express FF</h1>
        <p class="legal-text">Revendedor independiente • No afiliado a Garena, Moonton, Tencent ni miHoYo • Marcas © de sus dueños</p>
    </div>

    <!-- PANEL DEL ID JUGADOR -->
    <div class="card-panel">
        <p class="section-title"><i class="fa-solid fa-user-shield"></i> ID DEL JUGADOR</p>
        
        <div class="search-container">
            <input type="text" id="userId" class="input-id" placeholder="Ingresa tu ID">
            <!-- Botón con el icono de diamante como el original -->
            <button class="btn-search" onclick="verificarID()">
                <i class="fa-solid fa-gem"></i>
            </button>
        </div>
        
        <p class="example-text">Ejemplo: 6068831320</p>

        <!-- PANEL DE ÚLTIMO ID IMPLEMENTADO -->
        <div class="last-id-container">
            <span class="last-id-label">Último ID:</span>
            <span class="last-id-number" id="displayLastId">14967278843</span>
            <button class="btn-return" onclick="cargarUltimoID()"><i class="fa-solid fa-reply"></i></button>
        </div>

        <!-- BOTÓN HISTORIAL CON ICONO PLANETARIO -->
        <button class="btn-history">
            <i class="fa-solid fa-globe"></i> Historial
        </button>
    </div>

    <!-- SECCIÓN OTROS JUEGOS FLOTANTE -->
    <p class="games-section-title">OTROS JUEGOS</p>

    <!-- TARJETA INDEPENDIENTE DE BLOOD STRIKE -->
    <div class="game-card">
        <div class="game-details">
            <!-- Miniatura real optimizada para Blood Strike -->
            <img src="https://unsplash.com" alt="Blood Strike" class="game-img">
            <span class="game-title-text">Blood Strike</span>
        </div>
        <span class="badge-available">DISPONIBLE</span>
    </div>

    <!-- BOTONES COMPACTOS DE SOPORTE E INFORMACIÓN -->
    <div class="action-buttons-container">
        <a href="#" class="action-btn btn-tutorial"><i class="fa-solid fa-book"></i> Tutorial</a>
        <a href="#" class="action-btn btn-support"><i class="fa-brands fa-whatsapp"></i> Soporte</a>
    </div>

    <script>
        function verificarID() {
            var idInput = document.getElementById('userId').value;
            if(idInput.trim() === "") {
                alert("Por favor, ingresa un ID válido.");
                return;
            }
            // Guarda el ID como último consultado de forma dinámica
            document.getElementById('displayLastId').innerText = idInput;
