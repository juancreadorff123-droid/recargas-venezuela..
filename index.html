<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexa Store</title>
    <!-- Iconos de FontAwesome para WhatsApp, Lupas, Diamantes, etc. -->
    <link rel="stylesheet" href="https://cloudflare.com">
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Arial, sans-serif;
            background: url('https://peakpx.com') no-repeat center center fixed;
            background-size: cover;
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
            padding: 20px 10px 80px 10px;
        }

        h1.brand-title {
            font-size: 36px;
            font-weight: bold;
            margin: 20px 0 30px 0;
            text-shadow: 0 0 10px rgba(255,255,255,0.3);
        }

        /* Bloques contenedores azul oscuro con bordes brillantes */
        .card-panel {
            background: rgba(10, 20, 50, 0.7);
            border: 2px solid #1e3a8a;
            border-radius: 20px;
            width: 100%;
            max-width: 400px;
            padding: 25px;
            box-sizing: border-box;
            margin-bottom: 20px;
            box-shadow: 0 0 15px rgba(30, 58, 138, 0.5);
            transition: all 0.3s ease;
        }

        .section-title {
            text-align: center;
            font-size: 14px;
            font-weight: bold;
            color: #3b82f6;
            letter-spacing: 2px;
            margin-top: 0;
            margin-bottom: 20px;
            text-transform: uppercase;
        }

        /* Zona de búsqueda ID */
        .search-container {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }

        .input-id {
            flex: 1;
            background: rgba(15, 23, 42, 0.6);
            border: 2px solid #1e3a8a;
            border-radius: 12px;
            padding: 12px;
            color: white;
            font-size: 16px;
            outline: none;
        }

        .input-id::placeholder {
            color: #64748b;
        }

        .btn-search {
            background: #2563eb;
            border: none;
            border-radius: 12px;
            width: 50px;
            color: white;
            font-size: 18px;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Botón Historial largo */
        .btn-history {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            width: 100%;
            background: transparent;
            border: 2px solid #1e3a8a;
            border-radius: 12px;
            color: #3b82f6;
            padding: 12px;
            font-size: 16px;
            cursor: pointer;
            font-weight: 500;
        }

        /* NUEVO: Contenedor Verificando ID (Oculto al inicio) */
        #loader-panel {
            display: none; /* JavaScript lo mostrará al dar click */
            text-align: center;
        }

        .diamond-circle {
            width: 80px;
            height: 80px;
            border: 3px dashed #3b82f6;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0 auto 15px auto;
            animation: rotar 4s linear infinite;
        }

        .diamond-circle i {
            font-size: 32px;
            color: #3b82f6;
            text-shadow: 0 0 10px #2563eb;
            animation: destello 1.5s ease-in-out infinite alternate;
        }

        .loader-text {
            font-size: 12px;
            font-weight: bold;
            color: #94a3b8;
            letter-spacing: 2px;
            margin-bottom: 20px;
            text-transform: uppercase;
        }

        /* Barra de progreso animada */
        .progress-bar-container {
            width: 80%;
            height: 6px;
            background: rgba(15, 23, 42, 0.6);
            border-radius: 10px;
            margin: 0 auto;
            overflow: hidden;
            position: relative;
        }

        .progress-bar-fill {
            width: 40%;
            height: 100%;
            background: #3b82f6;
            border-radius: 10px;
            position: absolute;
            animation: moverBarra 1.5s infinite linear;
        }

        /* Bloque de Otros juegos */
        .games-title {
            font-size: 24px;
            font-weight: bold;
            margin-top: 0;
            margin-bottom: 20px;
        }

        .game-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(15, 23, 42, 0.5);
            padding: 12px;
            border-radius: 12px;
        }

        .game-info {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .game-icon {
            width: 45px;
            height: 45px;
            border-radius: 8px;
            object-fit: cover;
        }

        .game-name {
            font-size: 16px;
            font-weight: 500;
        }

        .status-badge {
            background: #991b1b;
            color: #ef4444;
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: bold;
            letter-spacing: 0.5px;
        }

        /* Botón flotante inferior de WhatsApp */
        .whatsapp-footer {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: rgba(0, 0, 0, 0.6);
            padding: 10px 18px;
            border-radius: 30px;
            display: flex;
            align-items: center;
            gap: 10px;
            text-decoration: none;
            color: white;
            font-weight: 600;
            font-size: 15px;
            border: 1px solid rgba(255,255,255,0.1);
            backdrop-filter: blur(5px);
            z-index: 100;
        }

        .whatsapp-footer i {
            color: #22c55e;
            font-size: 20px;
        }

        /* ANIMACIONES CSS */
        @keyframes rotar {
            100% { transform: rotate(360deg); }
        }
        @keyframes destello {
            from { opacity: 0.5; filter: drop-shadow(0 0 2px #2563eb); }
            to { opacity: 1; filter: drop-shadow(0 0 12px #3b82f6); }
        }
        @keyframes moverBarra {
            0% { left: -40%; }
            100% { left: 100%; }
        }
    </style>
</head>
<body>

    <!-- Título Principal -->
    <h1 class="brand-title">Nexa Store</h1>

    <!-- Panel 1: ID del Jugador -->
    <div class="card-panel">
        <p class="section-title">⚔️ ID DEL JUGADOR ⚔️</p>
        
        <div class="search-container">
            <input type="text" id="userId" class="input-id" placeholder="Ingresa tu ID">
            <button class="btn-search" onclick="verificarID()">
                <i class="fa-solid fa-magnifying-glass"></i>
            </button>
        </div>

        <button class="btn-history">
            <i class="fa-regular fa-clock"></i> Historial
        </button>
    </div>

    <!-- NUEVO Panel 2: Verificando ID (Controlado por JavaScript) -->
    <div class="card-panel" id="loader-panel">
        <div class="diamond-circle">
            <i class="fa-solid fa-gem"></i>
        </div>
        <div class="loader-text">Verificando ID</div>
        <div class="progress-bar-container">
            <div class="progress-bar-fill"></div>
        </div>
    </div>

    <!-- Panel 3: Otros Juegos -->
    <div class="card-panel" id="games-panel">
        <p class="games-title">Otros juegos</p>
        
        <div class="game-row">
            <div class="game-info">
                <img src="https://unsplash.com" alt="Blood Strike" class="game-icon">
                <span class="game-name">Blood Strike</span>
            </div>
            <span class="status-badge">DISPONIBLE</span>
        </div>
    </div>

    <!-- Botón Flotante de Soporte Técnico -->
    <a href="#" class="whatsapp-footer">
        <i class="fa-brands fa-whatsapp"></i>
        <span>Soporte Técnico</span>
    </a>

    <!-- CÓDIGO JAVASCRIPT: Hace funcionar la animación al dar clic -->
    <script>
        function verificarID() {
            var idInput = document.getElementById('userId').value;
            
            // Validar que el usuario haya escrito algo
            if(idInput.trim() === "") {
                alert("Por favor, ingresa un ID válido.");
                return;
            }

            // 1. Mostrar el panel de carga interactivo
            document.getElementById('loader-panel').style.display = 'block';
            
            // Opcional: Ocultar el panel de "Otros juegos" mientras carga, tal como en tu foto
            document.getElementById('games-panel').style.display = 'none';

            // 2. Simular que busca el ID durante 3.5 segundos y luego avisa
            setTimeout(function() {
                alert("ID Verificado con éxito: " + idInput);
                
                // Aquí podrías redirigir al menú de pagos o volver a mostrar todo
                document.getElementById('loader-panel').style.display = 'none';
                document.getElementById('games-panel').style.display = 'block';
            }, 3500);
        }
    </script>

</body>
    </html>
