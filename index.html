<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Recargas Venezuela</title>

  <style>
    body {
      background: #0b0718 url('https://pinimg.com') no-repeat center center fixed;
      background-size: cover;
      font-family: Arial, sans-serif;
      color: white;
      margin: 0;
    }

    /* TITULO PRINCIPAL */
    #xenox-title {
      display: block;
      width: 100%;
      text-align: center;
      font-size: 36px;
      font-weight: bold;
      padding: 20px 0;
      letter-spacing: 2px;
      color: white !important;
      text-shadow:
        0 0 5px #3b82f6,
        0 0 10px #3b82f6,
        0 0 20px #2563eb,
        0 0 35px rgba(37,99,235,0.7);
    }

    /* TITULO ID DEL JUGADOR */
    .titulo-id {
      text-align: center;
      font-size: 22px;
      font-weight: bold;
      margin-bottom: 15px;
      color: #60a5fa;
      text-shadow: 0 0 8px #3b82f6, 0 0 15px #1d4ed8;
    }

    /* CONTENEDOR PRINCIPAL */
    .container { 
      max-width: 520px; 
      margin: auto; 
      padding: 15px; 
    }

    /* ESTADO DEL SERVICIO */
    .estado-servicio { 
      text-align: center; 
      background: #0f2f1f; 
      color: #22c55e; 
      padding: 10px; 
      font-size: 14px; 
      border-bottom: 1px solid #22c55e; 
    }

    /* TARJETAS CONTENEDORAS */
    .card {
      background: #151126cc;
      border: 1px solid #2563eb;
      padding: 22px;
      margin-top: 20px;
      border-radius: 14px;
      color: white;
      box-shadow: 0 0 15px rgba(37,99,235,0.3);
      transition: all 0.3s ease;
    }

    /* INPUTS */
    input {
      width: 100%;
      padding: 12px;
      margin: 10px 0;
      border: 2px solid #3b82f6;
      border-radius: 6px;
      background: rgba(19, 15, 38, 0.8);
      color: white;
      text-align: center;
      font-size: 16px;
      box-sizing: border-box;
      box-shadow: 0 0 10px rgba(59, 130, 246, 0.5);
    }

    /* BOTONES */
    button {
      padding: 10px;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }

    /* CUADRICULA DE PAQUETES */
    .grid { 
      display: grid; 
      grid-template-columns: repeat(2, 1fr); 
      gap: 10px; 
      margin-top: 15px;
    }

    /* 🔵 DIAL DE OPCIONES (DIAMANTES) */
    .opcion {
      background: #0b1220;
      border: 1px solid #1e3a8a;
      border-radius: 16px;
      padding: 18px;
      text-align: center;
      cursor: pointer;
      color: #60a5fa;
      font-weight: bold;
      transition: all 0.3s ease;
    }

    .opcion:hover {
      border-color: #3b82f6;
      box-shadow: 0 0 10px rgba(59, 130, 246, 0.5);
      transform: translateY(-2px);
    }
  </style>
</head>
<body>

  <!-- Barra de estado del servicio superior -->
  <div class="estado-servicio">🟢 SERVICIO DE RECARGAS ACTIVO</div>

  <div class="container">
    
    <h1 id="xenox-title">RECARGAS VENEZUELA</h1>
    
    <!-- Tarjeta principal para ingresar datos -->
    <div class="card">
      <div class="titulo-id">INGRESA TU ID DE JUGADOR</div>
      <input type="text" placeholder="Ej: 12345678">
    </div>

    <!-- Tarjeta para la selección de diamantes -->
    <div class="card">
      <div class="titulo-id" style="font-size: 18px;">SELECCIONA LA CANTIDAD</div>
      
      <div class="grid">
        <div class="opcion">💎 100 <br> Diamantes</div>
        <div class="opcion">💎 310 <br> Diamantes</div>
        <div class="opcion">💎 520 <br> Diamantes</div>
        <div class="opcion">💎 1060 <br> Diamantes</div>
      </div>
    </div>

  </div>

</body>
  </html>
