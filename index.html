<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recargas Express FF</title>
    <!-- Librería estable de iconos FontAwesome -->
    <link rel="stylesheet" href="https://cloudflare.com">
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: url('fondo.jpg') no-repeat center center fixed;
            background-size: cover;
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
            padding: 0px 16px 120px 16px;
            overflow-x: hidden;
        }

        /* HEADER ESTILO NEXUS REPRODUCIDO EXACTAMENTE */
        .header-nexus {
            width: 100vw;
            background: rgba(0, 0, 0, 0.9);
            padding: 20px 15px;
            text-align: center;
            box-sizing: border-box;
            border-bottom: 2.5px solid #ff7a00;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.8);
            margin-bottom: 35px;
        }

        .header-nexus h1 {
            font-size: 28px;
            font-weight: 900;
            margin: 0 0 6px 0;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            background: linear-gradient(180deg, #ffffff 10%, #ffaa00 50%, #ff5500 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 3px 10px rgba(255, 85, 0, 0.3);
        }

        .legal-text {
            font-size: 11px;
            color: #ffaa00;
            font-weight: 600;
            margin: 0;
            max-width: 500px;
            margin: 0 auto;
            line-height: 1.4;
            letter-spacing: 0.2px;
        }

        /* CONTENEDOR ESTILO PREMIUM GAMER CON CURVAS PRONUNCIADAS */
        .card-panel {
            background: rgba(8, 14, 30, 0.55); /* Súper translúcido */
            backdrop-filter: blur(16px) saturate(120%);
            -webkit-backdrop-filter: blur(16px) saturate(120%);
            border: 2px solid rgba(255, 122, 0, 0.7); /* Borde neón suavizado */
            border-radius: 32px; /* Esquinas muy redondeadas idénticas a la foto */
            width: 100%;
            max-width: 380px;
            padding: 30px 24px;
            box-sizing: border-box;
            margin-bottom: 25px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.7), 
                        inset 0 0 15px rgba(255, 122, 0, 0.1);
        }

        /* TEXTO DE SECCIÓN REDISEÑADO */
        .section-title {
            text-align: center;
            font-size: 15px;
            font-weight: 800;
            color: #ff7a00;
            letter-spacing: 2px;
            margin-top: 0;
            margin-bottom: 25px;
            text-transform: uppercase;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
        }

        .search-container {
            display: flex;
            gap: 12px;
            margin-bottom: 12px;
            align-items: center;
        }

        /* INPUT REDONDEADO Y OSCURO */
        .input-id {
            flex: 1;
            background: rgba(5, 8, 20, 0.85);
            border: 2px solid rgba(255, 122, 0, 0.4);
            border-radius: 18px; /* Mayor curvatura */
            padding: 16px;
            color: white;
            font-size: 16px;
            outline: none;
            transition: all 0.3s ease;
        }

        .input-id:focus {
            border-color: #ff7a00;
            box-shadow: 0 0 10px rgba(255, 122, 0, 0.3);
        }

        .input-id::placeholder {
            color: #4b5563;
        }

        /* BOTÓN DE BÚSQUEDA REDONDEADO CON ICONO CORREGIDO */
        .btn-search {
            background: linear-gradient(135deg, #ff9500, #ff5500);
            border: none;
            border-radius: 18px; /* Igual curvatura que el input */
            width: 60px;
            height: 56px;
            color: white;
            font-size: 20px;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: all 0.2s ease;
            box-shadow: 0 4px 15px rgba(255, 85, 0, 0.4);
        }

        .btn-search:active {
            transform: scale(0.95);
        }

        .example-text {
            font-size: 12px;
            color: #6b7280;
            text-align: center;
            margin: 0 0 20px 0;
            font-weight: 500;
        }

        /* BOTÓN HISTORIAL IDÉNTICO AL ORIGINAL */
        .btn-history {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            width: 100%;
            background: transparent;
            border: 2px solid rgba(255, 122, 0, 0.6);
            border-radius: 18px;
            color: #ff7a00;
            padding: 14px;
            font-size: 16px;
            cursor: pointer;
            font-weight: 700;
            transition: all 0.3s ease;
        }

        .btn-history:hover {
            background: rgba(255, 122, 0, 0.1);
        }

        /* PANEL DE CARGA VERIFICANDO ID */
        #loader-panel {
            display: none;
            text-align: center;
        }

        .diamond-circle {
            width: 85px;
            height: 85px;
            border: 3px dashed #ff7a00;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0 auto 15px auto;
            animation: rotar 5s linear infinite;
        }

        .diamond-circle i {
            font-size: 34px;
            color: #ff7a00;
            animation: destello 1.2s ease-in-out infinite alternate;
        }

        .loader-text {
            font-size: 14px;
            font-weight: 800;
            color: #ff7a00;
            letter-spacing: 2px;
            margin-bottom: 20px;
            text-transform: uppercase;
        }

        .progress-bar-container {
            width: 80%;
            height: 6px;
            background: rgba(5, 8, 20, 0.9);
            border-radius: 10px;
            margin: 0 auto;
            overflow: hidden;
            position: relative;
        }

        .progress-bar-fill {
            width: 45%;
            height: 100%;
            background: linear-gradient(90deg, #ff7a00, #ffaa00);
            border-radius: 10px;
            position: absolute;
            animation: moverBarra 1.4s infinite linear;
        }

        /* SECCIÓN OTROS JUEGOS */
        .card-panel-games {
            background: rgba(8, 14, 30, 0.55);
            backdrop-filter: blur(16px);
            border: 2px solid rgba(255, 122, 0, 0.5);
            border-radius: 32px;
            width: 100%;
            max-width: 380px;
            padding: 26px 24px;
            box-sizing: border-box;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.7);
        }

        .games-title {
            font-size: 18px;
            font-weight: 800;
            margin-top: 0;
            margin-bottom: 22px;
            text-transform: uppercase;
            letter-spacing: 1px;
            text-align: center;
            color: white;
        }

        .game-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(5, 8, 20, 0.6);
            padding: 14px 18px;
            border-radius: 20px;
            border: 1px solid rgba(255, 122, 0, 0.1);
        }

        .game-info {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .game-icon-fallback {
            width: 45px;
            height: 45px;
            border-radius: 12px;
            background: linear-gradient(135deg, #ff7a00, #ff5500);
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 20px;
            color: white;
        }

        .game-name {
            font-size: 16px;
            font-weight: 600;
        }

        .status-badge {
            background: rgba(34, 197, 94, 0.15);
            color: #22c55e;
            border: 1px solid rgba(34, 197, 94, 0.4);
            padding: 6px 14px;
            border-radius: 10px;
            font-size: 11px;
            font-weight: 800;
        }

        /* BOTÓN DE WHATSAPP FLOTANTE DISCRETO */
        .whatsapp-footer {
            position: fixed;
            bottom: 25px;
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(8px);
            padding: 14px 28px;
            border-radius: 50px;
            display: flex;
            align-items: center;
            gap: 12px;
            text-decoration: none;
            color: white;
            font-weight: 700;
            font-size: 15px;
            border: 1.5px solid #ff7a00;
            box-shadow: 0 10px 30px rgba(0,0,0,0.6);
            z-index: 100;
        }

        .whatsapp-footer i {
            color: #22c55e;
            font-size: 22px;
        }

        /* ANIMACIONES CSS */
        @keyframes rotar { 100% { transform: rotate(360deg); } }
        @keyframes destello {
            from { opacity: 0.4; filter: drop-shadow(0 0 2px #ff7a00); }
            to { opacity: 1; filter: drop-shadow(0 0 14px #ffaa00); }
        }
        @keyframes moverBarra {
            0% { left: -45%; }
            100% { left: 100%; }
        }
    </style>
</head>
<body>

    <!-- ENCABEZADO SUPERIOR CON ADVERTENCIA LEGAL -->
    <div class="header-nexus">
        <h1>Recargas Express FF</h1>
