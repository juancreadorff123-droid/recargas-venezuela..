<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>recargas venezuela</title>

  <!-- Fuentes e Iconos -->
  <link href="https://googleapis.com" rel="stylesheet">
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">
  <link rel="manifest" href="site.webmanifest">

  <style>
    /* ==========================================================================
       1. ESTILOS BASE Y GENERALES
       ========================================================================== */
    body {
      background: #0b0718 url('https://pinimg.com') no-repeat center center fixed;
      background-size: cover;
      font-family: Arial, sans-serif;
      color: white;
      margin: 0;
      transition: opacity 0.35s ease, transform 0.35s ease;
    }

    body.fade {
      opacity: 0.4;
    }

    .container {
      max-width: 520px;
      margin: auto;
      padding: 15px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
    }

    /* ==========================================================================
       2. COMPONENTES DE INTERFAZ (TARJETAS, ENTRADAS Y BOTONES)
       ========================================================================== */
    .card {
      position: relative;
      overflow: hidden;
      background: #151126cc;
      border: 1px solid #2563eb;
      padding: 22px;
      margin: 15px 0 20px 0;
      border-radius: 18px;
      color: white;
      box-shadow: 0 0 15px rgba(124, 58, 237, 0.3);
      transition: all 0.3s ease;
      animation: fadeInUp 0.6s ease-out forwards;
    }

    .card:hover {
      box-shadow: 0 0 25px rgba(59, 130, 246, 0.5);
      transform: scale(1.01);
    }

    #cardID {
      background: linear-gradient(145deg, rgba(10,15,35,0.95), rgba(30,64,175,0.25));
      border: 1px solid #2563eb;
      border-radius: 20px;
      padding: 22px;
      margin: 15px 0;
      box-shadow: 0 0 15px rgba(37,99,235,0.3);
      transition: all 0.3s ease;
    }

    #cardID:hover {
      box-shadow: 0 0 25px rgba(59, 130, 246, 0.5);
      transform: scale(1.01);
    }

    /* Formulario de ID */
    .input-contenedor {
      display: flex;
      align-items: center;
      border: 2px solid rgba(59,130,246,0.4);
      border-radius: 14px;
      background: #1e293b;
      overflow: hidden;
      padding: 0 12px;
      transition: border-color 0.3s;
      justify-content: space-between;
    }

    .input-contenedor:hover {
      border-color: rgba(59,130,246,0.8);
    }

    input, select {
      width: 100%;
      padding: 12px;
      margin-top: 10px;
      border: none;
      border-radius: 8px;
      background: #201942;
      color: white;
      font-weight: bold;
      transition: .2s;
    }

    #playerID {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: #e5e7eb;
      padding: 12px 0;
      font-size: 16px;
      margin-top: 0;
    }

    input.error {
      border: 2px solid #f00 !important;
    }

    .ejemplo-id {
      text-align: center;
      font-size: 12px;
      color: #9ca3af;
      margin-top: 8px;
    }

    /* Botones y Confirmaciones */
    button {
      padding: 12px;
      border: none;
      border-radius: 10px;
      cursor: pointer;
    }

    .btn-diamante {
      background: linear-gradient(145deg, rgba(10,15,35,0.95), rgba(30,64,175,0.35));
      border: 1px solid #2563eb;
      padding: 12px 16px;
      font-size: 18px;
      cursor: pointer;
      color: #e5e7eb;
      transition: all 0.3s ease;
    }

    .btn-diamante:hover {
      transform: scale(1.05);
      box-shadow: 0 0 12px rgba(59,130,246,0.4);
    }

    .btn-diamante:active {
      transform: scale(0.95);
    }

    .verificar {
      width: 100%;
      margin-top: 18px;
      padding: 18px;
      border-radius: 18px;
      cursor: pointer;
      background: linear-gradient(145deg, rgba(10,15,35,0.95), rgba(30,64,175,0.35));
      border: 1px solid #2563eb;
      color: #e5e7eb;
      font-weight: bold;
      font-size: 17px;
      letter-spacing: 1px;
      transition: all 0.3s ease;
      box-shadow: 0 0 12px rgba(37,99,235,0.35);
    }

    .verificar:hover {
      background: linear-gradient(145deg, rgba(10,15,35,1), rgba(59,130,246,0.45));
      transform: scale(1.05);
    }

    .verificar:active {
      transform: scale(0.97);
    }

    .confirm {
      width: 100%;
      margin-top: 10px;
      color: white;
      transition: background .5s;
    }

    /* ==========================================================================
       3. TIPOGRAFÍAS Y DISEÑO DE TEXTO
       ========================================================================== */
    #xenox-title {
      display: block;
      width: 100%;
      text-align: center;
      font-size: 36px;
      font-weight: bold;
      padding: 20px 0;
      letter-spacing: 2px;
      color: white !important;
      text-shadow: 0 0 5px #3b82f6, 0 0 10px #3b82f6, 0 0 20px #2563eb, 0 0 35px rgba(37,99,235,0.7);
      animation: glowTitulo 2s infinite alternate;
    }

    .titulo-id {
      text-align: center;
      font-size: 22px;
      font-weight: bold;
      margin-bottom: 15px;
      color: #f97316;
    }

    .total {
      margin-top: 18px;
      padding: 20px;
      border-radius: 16px;
      background: linear-gradient(145deg, rgba(15,23,42,0.9), rgba(30,58,138,0.35));
      border: 1px solid #2563eb;
      color: white;
      font-weight: bold;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 20px;
      box-shadow: 0 0 12px rgba(37,99,235,0.3);
    }

    /* ==========================================================================
       4. SECCIÓN JUEGOS Y OPCIONES (DIAMANTES / PROCESOS)
       ========================================================================== */
    .opcion {
      background: linear-gradient(145deg, rgba(10,15,35,0.95), rgba(30,64,175,0.25));
      border: 1px solid #2563eb;
      border-radius: 16px;
      padding: 18px;
      text-align: center;
      cursor: pointer;
      color: #60a5fa;
      transition: all 0.3s ease;
    }

    .opcion:hover {
      transform: scale(1.05);
      border-color: #60a5fa;
    }

    .opcion.seleccionado {
      background: #0f172a !important;
      position: relative;
      border: none !important;
      transform: scale(1.05);
      z-index: 1;
      border-radius: 16px;
      animation: glowFF 1.5s infinite alternate;
    }

    .opcion.seleccionado::before {
      content: "";
      position: absolute;
      top: -3px; left: -3px; right: -3px; bottom: -3px;
      background: linear-gradient(180deg, #60a5fa 0%, #3b82f6 25%, #2563eb 50%, #1d4ed8 100%);
      border-radius: 18px;
      z-index: -1;
      animation: brilloAzul 1.5s infinite alternate;
    }

    .opcion.seleccionado:hover::before {
      animation: brilloAzul 0.7s infinite alternate;
    }

    .opcion .diamantes {
      font-size: 20px;
      font-weight: bold;
      color: #38bdf8;
    }

    .opcion .precio {
      font-size: 14px;
      color: #cbd5f5;
      margin-top: 5px;
    }

    /* Bloques de Barra de Carga y Otros Juegos */
    .barraCarga {
      width: 200px;
      height: 10px;
      background: #201942;
      border-radius: 5px;
      overflow: hidden;
    }

    .game {
      display: flex;
      align-items: center;
      gap: 10px;
      background: #1c1536;
      padding: 10px;
      border-radius: 10px;
      margin-top: 8px;
    }

    .estado {
      margin-left: auto;
      font-size: 12px;
      padding: 4px 8px;
      border-radius: 6px;
    }

    .rojo { background: #7f1d1d; }
    .azul { background: #1e3a8a; }
    .amarillo { background: #92400e; }

    /* ==========================================================================
       5. MÉTODOS DE PAGO
       ========================================================================== */
    .metodo {
      background: linear-gradient(145deg, rgba(10,15,35,0.95), rgba(30,64,175,0.25)) !important;
      border: 1px solid #2563eb !important;
      border-radius: 16px;
      padding: 15px;
      margin-top: 10px;
      cursor: pointer;
      text-align: center;
      color: #60a5fa !important;
      transition: all 0.3s ease;
    }

    .metodo:hover {
      transform: scale(1.05);
      border-color: #60a5fa;
    }

    .metodo.seleccionado {
      border: 2px solid #38bdf8 !important;
      background: rgba(15,23,42,0.95) !important;
      box-shadow: 0 0 15px #38bdf8 !important;
    }

    /* ==========================================================================
       6. CHAT FLOTANTE, SOPORTE Y REDES SOCIALES
       ========================================================================== */
    .whatsapp {
      position: fixed;
      bottom: 20px;
      right: 20px;
      background: #25D366;
      color: white;
      padding: 15px;
      border-radius: 50px;
      font-weight: bold;
      box-shadow: 0 0 10px rgba(0,0,0,.5);
      cursor: pointer;
      display: none;
    }

    .soporte {
      position: fixed;
      bottom: 90px;
      right: 20px;
      padding: 15px;
      border-radius: 50px;
      font-weight: bold;
      cursor: pointer;
      color: white;
      animation: flotar 2s infinite alternate;
      transition: background .5s;
    }

      right: 20px;

      align-items: center;
      gap: 10px;
      padding: 8px 16px 8px 8px;
