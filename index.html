<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recargas Express FF</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Arial, sans-serif;
            background: url('fondo.jpg') no-repeat center center fixed;
            background-size: cover;
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
            padding-bottom: 140px;
        }

        /* HEADER SUPERIOR */
        .header-nexus {
            width: 100%;
            background: #0d0f14;
            padding: 18px 12px;
            text-align: center;
            box-sizing: border-box;
            border-bottom: 2px solid #ea580c;
        }

        .header-nexus h1 {
            font-size: 24px;
            font-weight: bold;
            margin: 0 0 6px 0;
            color: #f97316;
            letter-spacing: 0.5px;
        }

        .legal-text {
            font-size: 10.5px;
            color: #e2e8f0;
            margin: 0;
            line-height: 1.4;
            opacity: 0.8;
        }

        /* CONTENEDOR PRINCIPAL */
        .card-panel {
            background: rgba(15, 23, 42, 0.85);
            border: 2px solid rgba(249, 115, 22, 0.4);
            border-radius: 24px;
            width: 92%;
            max-width: 360px; /* Ajustado para que quepa bien en pantallas delgadas */
            padding: 24px 16px;
            box-sizing: border-box;
            margin-top: 30px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.7);
        }

        .section-title {
            font-size: 14px;
            font-weight: bold;
            color: #f97316;
            letter-spacing: 1px;
            margin-top: 0;
            margin-bottom: 22px;
            text-transform: uppercase;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        /* CONTENEDOR DE BÚSQUEDA CORREGIDO */
        .search-container {
            display: flex;
            width: 100%;
            gap: 8px;
            margin-bottom: 15px;
            box-sizing: border-box;
        }

        /* CAMPO ENTRADA DE ID SE ADAPTA AL ESPACIO RESTANTE */
        .input-id {
            flex: 1;
            min-width: 0; /* Evita que el input empuje al botón fuera de la pantalla */
            background: rgba(30, 41, 59, 0.7);
            border: 1.5px solid rgba(249, 115, 22, 0.3);
            border-radius: 14px;
            padding: 16px 12px;
            color: #f1f5f9;
            font-size: 16px;
            outline: none;
            box-sizing: border-box;
        }

        .input-id::placeholder {
            color: #94a3b8;
        }

        /* BOTÓN AZUL CIAN RECONSTRUIDO DENTRO DE LA CAJA */
        .btn-search {
            background: linear-gradient(135deg, #0ea5e9, #0284c7);
            border: none;
            border-radius: 14px;
            width: 58px;
            height: 54px;
            flex-shrink: 0; /* Evita que el botón se deforme o achique */
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 4px 14px rgba(2, 132, 199, 0.4);
            box-sizing: border-box;
        }

        .btn-search svg {
            width: 24px;
            height: 24px;
            fill: white;
        }

        .example-text {
            font-size: 12px;
            color: #64748b;
            text-align: center;
            margin: 0 0 20px 0;
        }

        /* ÚLTIMO ID GUARDADO */
        .last-id-container {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(15, 23, 42, 0.5);
            border: 1px solid rgba(249, 115, 22, 0.2);
            border-radius: 14px;
            padding: 10px 14px;
            margin-bottom: 20px;
        }

        .last-id-label {
            font-size: 12px;
            color: #94a3b8;
            max-width: 60px;
            line-height: 1.2;
        }

        .last-id-number {
            font-size: 19px;
            font-weight: bold;
            color: #ea580c;
            letter-spacing: 0.5px;
        }

        .btn-return {
            background: #ea580c;
            border: none;
            width: 36px;
            height: 34px;
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .btn-return svg {
            width: 18px;
            height: 18px;
            fill: white;
        }

        /* BOTÓN HISTORIAL */
        .btn-history {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            width: 100%;
            background: rgba(15, 23, 42, 0.8);
            border: 1.5px solid #0284c7;
            border-radius: 14px;
            color: #f97316;
            padding: 14px;
            font-size: 16px;
            cursor: pointer;
            font-weight: bold;
        }

        .btn-history svg {
            width: 18px;
            height: 18px;
            fill: #38bdf8;
        }

        /* TEXTO FLOTANTE DE OTROS JUEGOS */
        .games-section-title {
            text-align: center;
            font-size: 15px;
            font-weight: 800;
            color: #94a3b8;
            letter-spacing: 3px;
            margin-top: 35px;
            margin-bottom: 20px;
            text-transform: uppercase;
        }

        /* TARJETA DE FREE FIRE CORREGIDA */
        .game-card {
            background: rgba(15, 23, 42, 0.85);
            border-radius: 20px;
            width: 92%;
            max-width: 360px;
            padding: 14px 18px;
            box-sizing: border-box;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
        }

        .game-details {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        /* Icono de Free Fire */
        .game-icon-ff {
            width: 48px;
            height: 48px;
            border-radius: 12px;
            background: #1e293b;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 4px 10px rgba(249, 115, 22, 0.2);
            overflow: hidden;
        }

        .game-icon-ff img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .game-title-text {
            font-size: 18px;
            font-weight: bold;
            color: white;
        }

        .badge-available {
            background: rgba(16, 185, 129, 0.15);
            color: #10b981;
            border: 1px solid rgba(16, 185, 129, 0.4);
            padding: 5px 12px;
            border-radius: 8px;
            font-size: 11px;
            font-weight: 800;
            letter-spacing: 0.5px;
        }

        /* BOTONES FLOTANTES DE ACCIÓN INFERIOR */
        .action-buttons-container {
            position: fixed;
            bottom: 20px;
            right: 20px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            z-index: 100;
        }

        .action-btn {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 10px 18px;
            border-radius: 20px;
            color: white;
            font-weight: bold;
            font-size: 14px;
            text-decoration: none;
            box-shadow: 0 8px 20px rgba(0,0,0,0.4);
        }

        .action-btn svg {
            width: 16px;
            height: 16px;
            fill: white;
        }

        .btn-tutorial {
            background: #ea580c;
        }

        .btn-support {
            background: #10b981;
        }
    </style>
</head>
