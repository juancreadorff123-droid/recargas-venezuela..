<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recargas Venezuela</title>
    <style>
        /* Configuración global y Fondo de Goku */
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: url('https://peakpx.com') no-repeat center center fixed;
            background-size: cover;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #ffffff;
        }

        /* Capa oscura para que el texto resalte sobre la imagen */
        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.6);
            z-index: 1;
        }

        /* Contenedor principal de la página */
        .container {
            position: relative;
            z-index: 2;
            text-align: center;
            background: rgba(15, 23, 42, 0.85);
            padding: 30px;
            border-radius: 20px;
            border: 2px solid #22c55e; /* Borde verde brillante */
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
            width: 90%;
            max-width: 400px;
            animation: entrada Suave 0.6s ease-out;
        }

        /* Título Principal */
        h1 {
            font-size: 28px;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #22c55e; /* Color verde */
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
        }

        /* Subtítulo */
        p {
            font-size: 16px;
            color: #cbd5e1;
            margin-bottom: 25px;
        }

        /* Estilo de los botones */
        .btn {
            display: block;
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            background: #22c55e;
            color: #ffffff;
            text-decoration: none;
            font-weight: bold;
            border-radius: 10px;
            box-sizing: border-box;
            transition: background 0.3s ease;
        }

        .btn:hover {
            background: #16a34a;
        }

        /* Animación de entrada */
        @keyframes entradaSuave {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>
<body>

    <div class="overlay"></div>

    <div class="container">
        <h1>Recargas Venezuela</h1>
        <p>Selecciona una opción para gestionar tu saldo de forma rápida y segura.</p>
        
        <!-- Puedes cambiar los enlaces '#' por tus links reales luego -->
        <a href="#" class="btn">Recargar Saldo</a>
        <a href="#" class="btn">Consultar Tarifas</a>
        <a href="#" class="btn">Soporte WhatsApp</a>
    </div>

</body>
</html>
