<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexa Store</title>
    <!-- Corrección de iconos: Cargamos FontAwesome oficial desde CDN estable -->
    <link rel="stylesheet" href="https://cloudflare.com">
    <style>
        /* FONDO ANIMADO DIGITAL EN MOVIMIENTO */
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Arial, sans-serif;
            background: linear-gradient(125deg, #020617, #0f172a, #1e1b4b, #020617);
            background-size: 400% 400%;
            animation: fondoEspacial 15s ease infinite;
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
            padding: 40px 15px 100px 15px;
            overflow-x: hidden;
            position: relative;
        }

        /* Efecto de partículas brillantes flotando al fondo */
        body::before {
            content: "";
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image: radial-gradient(white 1px, transparent 1px);
            background-size: 40px 40px;
            opacity: 0.15;
            z-index: 0;
            pointer-events: none;
        }

        h1.brand-title {
            font-size: 38px;
            font-weight: 800;
            margin: 0 0 30px 0;
            text-transform: uppercase;
            letter-spacing: 2px;
            z-index: 1;
            background: linear-gradient(90deg, #ffffff, #3b82f6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 20px rgba(59, 130, 246, 0.4);
        }

        .card-panel {
            background: rgba(15, 23, 42, 0.65);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 2px solid #2563eb;
            border-radius: 24px;
            width: 100%;
            max-width: 380px;
            padding: 25px;
            box-sizing: border-box;
            margin-bottom: 25px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5), 0 0 20px rgba(37, 99, 235, 0.2);
            z-index: 1;
        }

        .section-title {
            text-align: center;
            font-size: 13px;
            font-weight: 800;
            color: #3b82f6;
            letter-spacing: 3px;
            margin-top: 0;
            margin-bottom: 22px;
        }

        .search-container {
            display: flex;
            gap: 12px;
            margin-bottom: 18px;
        }

        .input-id {
            flex: 1;
            background: rgba(2, 6, 17, 0.7);
            border: 2px solid #1e40af;
            border-radius: 14px;
            padding: 14px;
            color: white;
            font-size: 16px;
            outline: none;
            transition: border-color 0.3s;
        }

        .input-id:focus {
            border-color: #3b82f6;
        }

        .input-id::placeholder {
            color: #475569;
        }

        .btn-search {
            background: #2563eb;
            border: none;
            border-radius: 14px;
            width: 55px;
            color: white;
            font-size: 18px;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3);
            transition: background 0.2s;
        }

        .btn-search:hover {
            background: #1d4ed8;
        }

        .btn-history {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            width: 100%;
            background: transparent;
            border: 2px solid #1e40af;
            border-radius: 14px;
            color: #3b82f6;
            padding: 14px;
            font-size: 16px;
            cursor: pointer;
            font-weight: 600;
            transition: background 0.3s;
        }

        .btn-history:hover {
            background: rgba(59, 130, 246, 0.1);
        }

        /* Panel Carga Animado */
        #loader-panel {
            display: none;
            text-align: center;
        }

        .diamond-circle {
            width: 85px;
            height: 85px;
            border: 3px dashed #3b82f6;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0 auto 15px auto;
            animation: rotar 5s linear infinite;
        }

        .diamond-circle i {
            font-size: 34px;
            color: #3b82f6;
            animation: destello 1.2s ease-in-out infinite alternate;
        }

        .loader-text {
            font-size: 13px;
            font-weight: bold;
            color: #94a3b8;
            letter-spacing: 2px;
            margin-bottom: 20px;
            text-transform: uppercase;
        }

        .progress-bar-container {
            width: 85%;
            height: 6px;
            background: rgba(2, 6, 17, 0.8);
            border-radius: 10px;
            margin: 0 auto;
            overflow: hidden;
            position: relative;
        }

        .progress-bar-fill {
            width: 45%;
            height: 100%;
            background: linear-gradient(90deg, #2563eb, #60a5fa);
            border-radius: 10px;
            position: absolute;
            animation: moverBarra 1.4s infinite linear;
        }

        .games-title {
            font-size: 22px;
            font-weight: 700;
            margin-top: 0;
            margin-bottom: 20px;
        }

        .game-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(2, 6, 17, 0.4);
            padding: 14px;
            border-radius: 16px;
            border: 1px solid rgba(255,255,255,0.05);
        }

        .game-info {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        /* Corrección imagen Blood Strike (Icono digital genérico seguro) */
        .game-icon-fallback {
            width: 45px;
            height: 45px;
            border-radius: 10px;
            background: linear-gradient(135deg, #dc2626, #7f1d1d);
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 20px;
            color: white;
            box-shadow: 0 4px 10px rgba(220, 38, 38, 0.3);
        }

        .game-name {
            font-size: 16px;
            font-weight: 600;
        }

        .status-badge {
            background: rgba(220, 38, 38, 0.2);
            color: #ef4444;
            border: 1px solid rgba(239, 68, 68, 0.4);
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 11px;
            font-weight: 800;
            letter-spacing: 0.5px;
        }

        /* Botón de WhatsApp estilizado */
        .whatsapp-footer {
            position: fixed;
            bottom: 25px;
            background: #1e293b;
            padding: 12px 24px;
            border-radius: 50px;
            display: flex;
            align-items: center;
            gap: 12px;
            text-decoration: none;
            color: white;
            font-weight: 700;
            font-size: 15px;
            border: 1px solid #2563eb;
            box-shadow: 0 10px 25px rgba(0,0,0,0.4);
            z-index: 100;
            transition: transform 0.2s;
        }

        .whatsapp-footer:active {
            transform: scale(0.95);
        }

        .whatsapp-footer i {
            color: #22c55e;
            font-size: 22px;
        }

        /* ANIMACIONES */
        @keyframes fondoEspacial {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        @keyframes rotar {
            100% { transform: rotate(360deg); }
        }
        @keyframes destello {
            from { opacity: 0.4; filter: drop-shadow(0 0 2px #2563eb); }
            to { opacity: 1; filter: drop-shadow(0 0 14px #60a5fa); }
        }
        @keyframes moverBarra {
            0% { left: -45%; }
            100% { left: 100%; }
        }
    </style>
</head>
<body>

    <h1 class="brand-title">Nexa Store</h1>

    <!-- Panel 1: ID -->
    <div class="card-panel">
        <p class="section-title"><i class="fa-solid fa-crosshairs"></i> ID DEL JUGADOR <i class="fa-solid fa-crosshairs"></i></p>
        
        <div class="search-container">
            <input type="text" id="userId" class="input-id" placeholder="Ingresa tu ID">
            <button class="btn-search" onclick="verificarID()">
                <i class="fa-solid fa-magnifying-glass"></i>
            </button>
        </div>

        <button class="btn-history">
            <i class="fa-regular fa-clock"></i> Historial
        </button>
    </div>

    <!-- Panel 2: Verificando ID -->
    <div class="card-panel" id="loader-panel">
        <div class="diamond-circle">
            <i class="fa-solid fa-gem"></i>
        </div>
        <div class="loader-text">Verificando ID</div>
        <div class="progress-bar-container">
            <div class="progress-bar-fill"></div>
        </div>
    </div>

    <!-- Panel 3: Otros Juegos -->
    <div class="card-panel" id="games-panel">
        <p class="games-title">Otros juegos</p>
        
        <div class="game-row">
            <div class="game-info">
                <!-- Reemplazo seguro de imagen rota por contenedor digital fluido -->
                <div class="game-icon-fallback">
                    <i class="fa-solid fa-gun"></i>
    </div>
