<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexa Store</title>
    <!-- Enlace de iconos oficial y directo de FontAwesome -->
    <link rel="stylesheet" href="https://cloudflare.com">
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Arial, sans-serif;
            background: url('fondo.jpg') no-repeat center center fixed;
            background-size: cover;
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
            padding: 50px 15px 100px 15px; /* Empujamos todo hacia abajo */
            overflow-x: hidden;
            position: relative;
        }

        /* Capa de brillo neón para que resalten las cajas */
        body::before {
            content: "";
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at top right, rgba(6, 182, 212, 0.15), transparent),
                        radial-gradient(circle at bottom left, rgba(236, 72, 153, 0.15), transparent);
            z-index: 0;
            pointer-events: none;
        }

        h1.brand-title {
            font-size: 38px;
            font-weight: 800;
            margin: 20px 0 25px 0;
            text-transform: uppercase;
            letter-spacing: 2px;
            z-index: 1;
            background: linear-gradient(90deg, #ffffff, #06b6d4);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 15px rgba(6, 182, 212, 0.5);
            text-align: center;
        }

        /* Bloques contenedores azul oscuro */
        .card-panel {
            background: rgba(10, 15, 30, 0.85); /* Un poco más oscuro para leer mejor */
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border: 2px solid #06b6d4;
            border-radius: 20px;
            width: 100%;
            max-width: 380px;
            padding: 22px;
            box-sizing: border-box;
            margin-bottom: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6), 0 0 15px rgba(6, 182, 212, 0.2);
            z-index: 1;
        }

        .section-title {
            text-align: center;
            font-size: 13px;
            font-weight: 800;
            color: #06b6d4;
            letter-spacing: 3px;
            margin-top: 0;
            margin-bottom: 20px;
        }

        .search-container {
            display: flex;
            gap: 12px;
            margin-bottom: 15px;
        }

        .input-id {
            flex: 1;
            background: rgba(2, 6, 17, 0.8);
            border: 2px solid #0891b2;
            border-radius: 12px;
            padding: 14px;
            color: white;
            font-size: 16px;
            outline: none;
        }

        .input-id:focus {
            border-color: #06b6d4;
        }

        .input-id::placeholder {
            color: #475569;
        }

        .btn-search {
            background: #06b6d4;
            border: none;
            border-radius: 12px;
            width: 55px;
            color: white;
            font-size: 18px;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 4px 12px rgba(6, 182, 212, 0.3);
        }

        .btn-history {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            width: 100%;
            background: transparent;
            border: 2px solid #0891b2;
            border-radius: 12px;
            color: #06b6d4;
            padding: 12px;
            font-size: 16px;
            cursor: pointer;
            font-weight: 600;
        }

        /* Panel Carga Animado */
        #loader-panel {
            display: none;
            text-align: center;
        }

        .diamond-circle {
            width: 80px;
            height: 80px;
            border: 3px dashed #06b6d4;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0 auto 15px auto;
            animation: rotar 5s linear infinite;
        }

        .diamond-circle i {
            font-size: 32px;
            color: #06b6d4;
            animation: destello 1.2s ease-in-out infinite alternate;
        }

        .loader-text {
            font-size: 13px;
            font-weight: bold;
            color: #94a3b8;
            letter-spacing: 2px;
            margin-bottom: 20px;
            text-transform: uppercase;
        }

        .progress-bar-container {
            width: 85%;
            height: 6px;
            background: rgba(2, 6, 17, 0.8);
            border-radius: 10px;
            margin: 0 auto;
            overflow: hidden;
            position: relative;
        }

        .progress-bar-fill {
            width: 45%;
            height: 100%;
            background: linear-gradient(90deg, #06b6d4, #ec4899);
            border-radius: 10px;
            position: absolute;
            animation: moverBarra 1.4s infinite linear;
        }

        .games-title {
            font-size: 22px;
            font-weight: 700;
            margin-top: 0;
            margin-bottom: 20px;
        }

        .game-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(2, 6, 17, 0.5);
            padding: 14px;
            border-radius: 14px;
        }

        .game-info {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .game-icon-fallback {
            width: 45px;
            height: 45px;
            border-radius: 10px;
            background: linear-gradient(135deg, #ec4899, #701a75);
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 20px;
            color: white;
        }

        .game-name {
            font-size: 16px;
            font-weight: 600;
        }

        .status-badge {
            background: rgba(220, 38, 38, 0.2);
            color: #ef4444;
            border: 1px solid rgba(239, 68, 68, 0.4);
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 11px;
            font-weight: 800;
        }

        /* Botón de WhatsApp flotante */
        .whatsapp-footer {
            position: fixed;
            bottom: 25px;
            background: #1e293b;
            padding: 12px 24px;
            border-radius: 50px;
            display: flex;
            align-items: center;
            gap: 12px;
            text-decoration: none;
            color: white;
            font-weight: 700;
            font-size: 15px;
            border: 1px solid #06b6d4;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            z-index: 100;
        }

        .whatsapp-footer i {
            color: #22c55e;
            font-size: 22px;
        }

        /* ANIMACIONES CSS */
        @keyframes rotar { 100% { transform: rotate(360deg); } }
        @keyframes destello {
            from { opacity: 0.4; filter: drop-shadow(0 0 2px #06b6d4); }
            to { opacity: 1; filter: drop-shadow(0 0 14px #ec4899); }
        }
        @keyframes moverBarra {
            0% { left: -45%; }
            100% { left: 100%; }
        }
    </style>
</head>
<body>

    <!-- Título Principal -->
    <h1 class="brand-title">Nexa Store</h1>

    <!-- Panel 1: ID -->
    <div class="card-panel">
        <p class="section-title"><i class="fa-solid fa-bolt"></i> ID DEL JUGADOR <i class="fa-solid fa-bolt"></i></p>
        
        <div class="search-container">
            <input type="text" id="userId" class="input-id" placeholder="Ingresa tu ID">
            <button class="btn-search" onclick="verificarID()">
                <i class="fa-solid fa-magnifying-glass"></i>
            </button>
        </div>

        <button class="btn-history">
            <i class="fa-regular fa-clock"></i> Historial
        </button>
    </div>

    <!-- Panel 2: Verificando ID -->
    <div class="card-panel" id="loader-panel">
        <div class="diamond-circle">
            <i class="fa-solid fa-gem"></i>
        </div>
        <div class="loader-text">Verificando ID</div>
        <div class="progress-bar-container">
            <div class="progress-bar-fill"></div>
        </div>
    </div>

    <!-- Panel 3: Otros Juegos -->
    <div class="card-panel" id="games-panel">
        <p class="games-title">Otros juegos</p>
        
        <div class="game-row">
            <div class="game-info">
                <div class="game-icon-fallback">
                    <i class="fa-solid fa-gun"></i>
                </div>
                <span class="game-name">Blood Strike</span>
            </div>
            <span class="status-badge">DISPONIBLE</span>
        </div>
    </div>

    <!-- Soporte flotante -->
    <a href="#" class="whatsapp-footer">
        <i class="fa-brands fa-whatsapp"></i>
        <span>Soporte Técnico</span>
    </a>

            var idInput = document.getElementById('userId').value;
            if(idInput.trim() === "") {
                alert("Por favor, ingresa un ID válido.");
                return;
            }
            document.getElementById('loader-panel').style.display = 'block';
            document.getElementById('games-panel').style.display = 'none';

            setTimeout(function() {
                alert("ID Verificado con éxito: " + idInput);
